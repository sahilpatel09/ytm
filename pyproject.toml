[project]
name = "ytm"
version = "0.1.0"
description = "YouTube Music player in the terminal"
requires-python = ">=3.11"
dependencies = [
    "textual>=3.2.0",
    "ytmusicapi>=1.0.0",
    "yt-dlp>=2025.1.1",
    "syncedlyrics>=1.0.1",
]

[project.scripts]
ytm = "ytm.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ytm"]
